/* =========================================================================
   코스피 인 더 클래스 — 모의투자 (Kahoot 방식) v3

:root{

  --gold:#f0a500;
  --fs:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --shadow:0 1px 2px rgba(20,22,30,.04),0 4px 16px -8px rgba(20,22,30,.10);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}

.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";letter-spacing:-.01em}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}

#app{min-height:100%}
.wrap{max-width:480px;margin:0 auto;padding:16px 14px 210px}
.wrap.wide{max-width:920px;padding-bottom:40px}

.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}

.pill.live{background:var(--up-bg);color:var(--up)}

.pill.demo{background:#fff5e0;color:#a9760a}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}

.hr{height:1px;background:var(--line);margin:14px 0;border:0}

.btn-green{background:var(--green);color:#fff} .btn-green:hover:not(:disabled){background:var(--green-d)}
.btn-dark{background:var(--ink);color:#fff} .btn-dark:hover:not(:disabled){filter:brightness(1.15)}
.btn-line{background:#fff;color:var(--ink);border:1.5px solid var(--line2)} .btn-line:hover:not(:disabled){background:#fafbfc}

input.field{width:100%;background:#fff;border:1.5px solid var(--line2);border-radius:11px;color:var(--ink);padding:14px;font-family:var(--fs);font-size:16px;font-weight:600}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===================== CONFIG (백엔드 접속) ===================== */
const CFG = {
  url: 'https://jfooezuqzskkjyfbthej.supabase.co',
  key: 'sb_publishable_qTUqE7CrZDNN98V6QRSEpg_HCvksNAE',
};
/* 기기별 게임 토큰: DB가 이 토큰으로 진행자/학생 권한을 확인함 (x-game-token 헤더) */
const GAME_TOKEN = (()=>{ const K='kitc_game_token'; let t=null;
  try{ t=localStorage.getItem(K); }catch(e){}
  if(!/^[a-f0-9]{64}$/.test(t||'')){ const b=new Uint8Array(32); crypto.getRandomValues(b);
    t=Array.from(b,x=>x.toString(16).padStart(2,'0')).join(''); try{ localStorage.setItem(K,t); }catch(e){} }
  return t; })();
let ROOM_CODE_HDR = ''; // 학생이 방을 읽을 때 필요한 방 코드 (x-room-code 헤더)
function gameFetch(input, init={}){
  const h=new Headers(init.headers||{}); h.set('x-game-token',GAME_TOKEN);
  if(ROOM_CODE_HDR) h.set('x-room-code',ROOM_CODE_HDR);
  return fetch(input,{...init,headers:h}); }
let sb = null;

async function runPool(items,n,fn){ let i=0; await Promise.all(Array.from({length:Math.min(n,items.length)},async()=>{ while(i<items.length){ const it=items[i++]; await fn(it); } })); }

/* ---------- 가격·손익 계산 (모두 정수 원 단위) ----------
   PRICE[k][r] = r라운드 매수가. r라운드 매도가 = PRICE[k][r+1]. 가격은 10원 단위. */
const PRICE = {};
COMPANIES.forEach(c=>{ let p=c.price; PRICE[c.k]=[null]; for(let r=1;r<=NROUNDS+1;r++){ PRICE[c.k][r]=round10(p); p=round10(p*(1+((RETURNS[r]||{})[c.k]||0)/100)); } });
const priceAt = (k,r) => PRICE[k][r];
const sellAt  = (k,r) => PRICE[k][r+1];
function sanitizeAlloc(a){ const o={}; COMPANIES.forEach(c=>{ const q=Math.floor(Number(a&&a[c.k])||0); if(q>0) o[c.k]=Math.min(q,1e9); }); return o; }
function costOf(a,r){ return COMPANIES.reduce((s,c)=>s+(a[c.k]||0)*priceAt(c.k,r),0); }
/* 예산을 넘는 주문은 비율대로 줄여서 반드시 예산 안으로 맞춤 */
function fitAlloc(a,r,budget){ const o=sanitizeAlloc(a); const cost=costOf(o,r); if(cost<=budget) return o;
  const f=Math.max(0,budget)/cost; COMPANIES.forEach(c=>{ if(o[c.k]){ o[c.k]=Math.floor(o[c.k]*f); if(!o[c.k]) delete o[c.k]; } }); return o; }
function computeGain(alloc,r){
  const a=sanitizeAlloc(alloc); let gain=0, spent=0, sold=0; const per={};
  COMPANIES.forEach(c=>{ const qty=a[c.k]||0, price=priceAt(c.k,r), newP=sellAt(c.k,r), ret=RETURNS[r][c.k];
    per[c.k]={qty,price,newP,ret,cost:qty*price,value:qty*newP,gain:qty*(newP-price)};
    spent+=qty*price; sold+=qty*newP; gain+=qty*(newP-price); });
  return {gain,spent,sold,per};
}

async function tickHost(){
  if(ME.mode!=='live' || ticking) return; ticking=true;
  try{
    const rm=await q(sb.from('invest_rooms').select('*').eq('id',ME.roomId).limit(1));
    if(!rm.length){ return hostGone(); }
    ROOM=rm[0];
    PLAYERS=await q(sb.from('invest_players').select('*').eq('room_id',ME.roomId).order('created_at'));
    SUBS = ROOM.round>0 ? await q(sb.from('invest_submissions').select('*').eq('room_id',ME.roomId).eq('round',ROOM.round)) : [];
    setNet(true); paint(false);
  }catch(e){ console.warn('host tick',e); setNet(false); }
  finally{ ticking=false; }
}
async function tickStudent(){
  if(ME.mode!=='live' || ticking) return; ticking=true;
  try{
    const rm=await q(sb.from('invest_rooms').select('*').eq('id',ME.roomId).limit(1));
    if(!rm.length){ return studentGone('방이 닫혔거나 찾을 수 없어요.'); }
    ROOM=rm[0]; tickN++;
    const sig=ROOM.stage+'|'+ROOM.round;
    if(sig!==lastRoomSig || !myPlayer || tickN%8===0){
      const me=await q(sb.from('invest_players').select('*').eq('id',ME.playerId).limit(1));
      if(!me.length){ return studentGone('참가자 정보를 찾을 수 없어요. 다시 입장해 주세요.'); }
      myPlayer=me[0]; ME.name=myPlayer.name;
      if(ROOM.round>0){ const s=await q(sb.from('invest_submissions').select('*').eq('player_id',ME.playerId).eq('round',ROOM.round).limit(1));
        // 방금 제출한 직후에 늦게 도착한 '제출 없음' 응답이 제출 상태를 지우지 않도록
        if(s[0] || !(mySub && mySub.round===ROOM.round && Date.now()-lastSubmitAt<8000)) mySub=s[0]||null; }
      else mySub=null;
      if(ROOM.stage==='reveal'||ROOM.stage==='final'){ ALLPLAYERS=await q(sb.from('invest_players').select('id,name,balance').eq('room_id',ME.roomId)); }
      if(ROOM.stage==='final'){ MYHIST=await q(sb.from('invest_submissions').select('*').eq('player_id',ME.playerId).order('round')); }
      if(sig!==lastRoomSig){ editing=false; }
      lastRoomSig=sig; saveStu();
    }
    setNet(true); paint(false);
  }catch(e){ console.warn('student tick',e); setNet(false); }
  finally{ ticking=false; }
}

}

function updClock(){
  const ms=remainMs();
  document.querySelectorAll('.cd').forEach(e=>{ if(ms==null){ e.style.display='none'; return; }
    e.style.display=''; e.textContent = ms>0 ? '⏱ '+fmtClock(ms) : '⏰ 시간 종료'; e.classList.toggle('warn', ms<=30000); });
  const rb=el('revealBtn'); if(rb) rb.classList.toggle('pulse', ms!=null && ms<=0);
  // 학생: 시간이 끝나면 고르던 주문을 자동 제출
  if(ME.role==='student' && ME.mode==='live' && ME.playerId && ms!=null && ms<=1500 && ROOM.stage==='round' && (!mySub||editing) && autoRound!==ROOM.round){

}

async function hostStart(){
  if(!LIVE_OK){ alert('온라인 서버에 연결되어 있지 않아 진행자 모드를 열 수 없어요. 데모 체험을 이용해 주세요.'); return; }
  if(busy) return; busy=true;
  try{
    // 이 기기로 만든 진행 중인 방이 있으면 이어서 진행 (DB가 내 방만 보여줌)
    ROOM_CODE_HDR='';
    const since=new Date(Date.now()-12*3600*1000).toISOString();
    const mine=await q(sb.from('invest_rooms').select('*').neq('stage','final').gte('created_at',since).order('created_at',{ascending:false}).limit(1));
    busy=false;
    if(mine.length && confirm(`이 기기로 진행하던 방(${mine[0].code})이 있어요.\n이어서 진행할까요?\n\n[취소]를 누르면 새 방을 만들어요.`)){ return resumeHost({roomId:mine[0].id,roomCode:mine[0].code}); }
  }catch(e){ busy=false; }
  createRoomLive();
}
async function createRoomLive(){
  if(busy) return; busy=true;
  try{
    let room=null, lastErr=null;
    for(let i=0;i<6 && !room;i++){ const code=genCode(); ROOM_CODE_HDR=code;
      try{ room=await q(sb.from('invest_rooms').insert({code,stage:'lobby',round:0}).select().single()); }catch(e){ lastErr=e; } }
    if(!room){ alert('방 생성에 실패했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.'+(lastErr?'\n('+lastErr.message+')':'')); busy=false; return; }
    ME.role='host'; ME.mode='live'; ME.roomId=room.id; ME.roomCode=room.code; ROOM=room; PLAYERS=[]; SUBS=[];
    saveHost(); go('#/host'); lastSig=''; startPolling(); render();
  }catch(e){ alert('오류: '+e.message); }
  busy=false;
}
function resumeHost(s){
  if(!s||!s.roomId) return render();
  ME.role='host'; ME.mode='live'; ME.roomId=s.roomId; ME.roomCode=s.roomCode; ROOM_CODE_HDR=s.roomCode;
  ROOM=null; PLAYERS=[]; SUBS=[]; saveHost(); go('#/host'); lastSig=''; startPolling(); render();
}
function hostGone(){ stopPolling(); LS.del(SK_HOST); alert('방을 찾을 수 없어요. 처음 화면으로 돌아갑니다.'); ME.role=null; ME.mode=null; ROOM=null; go('#/'); render(); }

function hostTimer(sec){ hostAction(()=>{
  if(sec===null) return hostUpdateRoom({deadline:null});
  const base = sec<0 ? 0 : Date.now();
  const cur = ROOM.deadline ? Date.parse(ROOM.deadline) : Date.now();
  const t = sec<0 ? Math.max(cur,Date.now()) + (-sec)*1000 : base + sec*1000;
  return hostUpdateRoom({deadline:new Date(t).toISOString()}); }); }
function setRevealBtn(t){ const b=el('revealBtn'); if(b){ b.disabled=true; b.textContent=t; } }

/* 결과 집계: 몇 번을 다시 눌러도 같은 결과가 나오도록 설계 (멱등)
   라운드 시작 자산 = 200만원 + 이전 라운드 손익 합계, 종료 자산 = 시작 자산 + 이번 라운드 손익 */
async function hostReveal(){
  if(busy) return;
  if(ROOM.stage==='round'){
    const subbed=new Set(SUBS.map(s=>s.player_id)); const notDone=PLAYERS.filter(p=>!subbed.has(p.id)).length; const ms=remainMs();
    if(notDone>0 && !(ms!=null && ms<=0) && !confirm(`아직 ${notDone}명이 제출하지 않았어요.\n\n지금 마감하면 학생들이 고르던 주문은 자동 제출되고, 아무것도 고르지 않은 학생은 현금 보유로 처리돼요.\n\n마감할까요?`)) return;
  }
  busy=true;
  const round=ROOM.round; let stage=ROOM.stage; // 폴링이 ROOM을 덮어써도 흐름이 흔들리지 않도록 지역 변수 사용
  try{
    if(stage==='round'){
      const ms=remainMs();
      let dl=ROOM.deadline;
      if(ms==null || ms>0){ dl=new Date().toISOString(); await q(sb.from('invest_rooms').update({deadline:dl}).eq('id',ME.roomId)); ROOM={...ROOM,deadline:dl}; }
      const until=Date.parse(dl)+6000;
      while(Date.now()<until){ setRevealBtn(`학생 주문 마감 중… ${Math.ceil((until-Date.now())/1000)}초`); await sleep(250); }
      await q(sb.from('invest_rooms').update({stage:'closing'}).eq('id',ME.roomId)); ROOM={...ROOM,stage:'closing'}; stage='closing'; lastSig=''; render();
    }
    if(stage==='closing'){
      setRevealBtn('결과 집계 중…');
      await scoreRound(round);
      await q(sb.from('invest_rooms').update({stage:'reveal',deadline:null}).eq('id',ME.roomId)); ROOM={...ROOM,stage:'reveal',deadline:null};
    }
  }catch(e){ alert('결과 집계 중 오류가 났어요. [결과 다시 집계] 버튼을 눌러 주세요. (중복 계산되지 않아요)\n('+e.message+')'); }
  busy=false; lastSig=''; await tickHost(); render();
}
async function scoreRound(round){
  const players=await q(sb.from('invest_players').select('*').eq('room_id',ME.roomId));
  const subs=await q(sb.from('invest_submissions').select('*').eq('room_id',ME.roomId));
  const rows=[], newBal={};
  for(const p of players){
    const mine=subs.filter(s=>s.player_id===p.id);
    const startBal=START+mine.filter(s=>s.round<round).reduce((a,s)=>a+Number(s.gain||0),0);
    const cur=mine.find(s=>s.round===round);
    const alloc=fitAlloc(cur?cur.alloc:{}, round, startBal);
    const {gain,spent}=computeGain(alloc,round);
    rows.push({room_id:ME.roomId,player_id:p.id,round,alloc,invested:spent,gain,end_balance:startBal+gain});
    newBal[p.id]=startBal+gain;
  }
  for(let i=0;i<rows.length;i+=100) await q(sb.from('invest_submissions').upsert(rows.slice(i,i+100),{onConflict:'player_id,round'}));
  await runPool(players.filter(p=>Number(p.balance)!==newBal[p.id]), 8, p=>q(sb.from('invest_players').update({balance:newBal[p.id]}).eq('id',p.id)));
}
function hostRestart(){
  if(!confirm('같은 학생들과 새 게임을 시작할까요?\n모든 학생의 자산이 200만원으로 초기화돼요.')) return;
  hostAction(async()=>{
    await q(sb.from('invest_submissions').delete().eq('room_id',ME.roomId));
    await q(sb.from('invest_players').update({balance:START}).eq('room_id',ME.roomId));
    await hostUpdateRoom({stage:'lobby',round:0,deadline:null});
  });
}

function stockResultTable(round){
  const r=RETURNS[round]; const sorted=[...COMPANIES].sort((a,b)=>r[b.k]-r[a.k]);
  const rows=sorted.map(c=>{const v=r[c.k];
    return `<tr><td><div class="co-cell"><span class="dot" style="background:${c.color}">${c.name[0]}</span><div><div style="font-weight:700">${c.name}</div><div class="px2 num">${fmt(priceAt(c.k,round))} → ${fmt(sellAt(c.k,round))}원</div></div></div></td>
    <td class="r"><span class="pct ${cls(v)}"><span class="a">${arw(v)}</span>${sgn(v)}${v}%</span></td></tr>`;}).join('');
  return `<table class="rtab"><thead><tr><th>기업 · 주가 (매수가 → 매도가)</th><th class="r">${round}R 등락</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function roundStats(round){
  const scored=SUBS.filter(s=>s.round===round);
  const buyers={}; scored.forEach(s=>Object.entries(s.alloc||{}).forEach(([k,v])=>{ if(v>0) buyers[k]=(buyers[k]||0)+1; }));
  const top=Object.entries(buyers).sort((a,b)=>b[1]-a[1])[0];
  const rets=scored.map(s=>{ const st=Number(s.end_balance)-Number(s.gain); return st>0?Number(s.gain)/st*100:0; });
  const avg=rets.length?rets.reduce((a,b)=>a+b,0)/rets.length:0;
  const cashOnly=scored.filter(s=>!Object.values(s.alloc||{}).some(v=>v>0)).length;
  return {top:top?{c:co(top[0]),n:top[1]}:null, avg, cashOnly, n:scored.length};
}
function rankList(list, limit){
  const sorted=[...list].sort((a,b)=>Number(b.balance)-Number(a.balance));
  return (limit?sorted.slice(0,limit):sorted).map(p=>{ const rk=1+sorted.filter(x=>Number(x.balance)>Number(p.balance)).length; const ret=(Number(p.balance)/START-1)*100;
    return `<div class="prow"><span class="rk ${rk<=3?'top':''}">${rk===1?'🏆':rk}</span><span class="pn">${esc(p.name)}</span><span class="pb num">${won(p.balance)} <span class="tiny ${cls(ret)}">${pctTxt(ret)}</span></span></div>`; }).join('');
}

      <div class="stat"><div class="l">가장 많이 산 종목</div><div class="v" style="font-size:18px;color:${st.top?st.top.c.color:'inherit'}">${st.top?st.top.c.name+' <span class="tiny muted">'+st.top.n+'명</span>':'-'}</div></div>

    <div class="plist">${rankList(PLAYERS,10)||'<div class="center muted">참가자 없음</div>'}</div>

}
function hostFinal(){
  const ranked=[...PLAYERS].sort((a,b)=>Number(b.balance)-Number(a.balance));
  const avg = ranked.length? ranked.reduce((s,p)=>s+Number(p.balance),0)/ranked.length : START;
  const best=bestStockOverall(), perfect=perfectPlay();
  const pd=(p,cls2,md)=>p?`<div class="pd ${cls2}"><div class="md">${md}</div><div class="nm">${esc(p.name)}</div><div class="bl num">${won(p.balance)}</div><div class="tiny ${cls(p.balance-START)}">${pctTxt((p.balance/START-1)*100)}</div></div>`:'<div></div>';
  return `
  <div class="card center"><div class="eyebrow">최종 결과</div><h2 style="margin:6px 0 14px">🏁 투자 랭킹</h2>
    <div class="podium">${pd(ranked[1],'','🥈')}${pd(ranked[0],'p1','🥇')}${pd(ranked[2],'','🥉')}</div>
    <div class="stat-row" style="margin-top:14px">
      <div class="stat"><div class="l">참가 인원</div><div class="v num">${ranked.length}명</div></div>
      <div class="stat"><div class="l">평균 수익률</div><div class="v num ${cls(avg-START)}">${pctTxt((avg/START-1)*100)}</div></div>
      <div class="stat"><div class="l">최고 수익 종목</div><div class="v" style="font-size:18px;color:${best.color}">${best.name}</div></div></div>
  </div>
  <div class="card"><h3 style="margin-bottom:10px">전체 순위</h3><div class="plist cols">${rankList(PLAYERS)||'<div class="center muted">참가자 없음</div>'}</div></div>
  <div class="card"><div class="callout" style="margin-top:0"><div class="t">📌 마무리</div>4라운드 동안 가장 많이 오른 주식은 <b style="color:${best.color}">${best.name}</b>(누적 <b>${pctTxt(best.cum)}</b>)였어요. 매 라운드 가장 많이 오를 종목에 전 재산을 걸었다면 <b>${won(perfect)}</b>까지 가능했어요. 하지만 실제 투자에서 미래를 완벽히 맞히는 건 불가능해요. 그래서 <b>분산 투자</b>와 <b>뉴스의 속뜻을 읽는 힘</b>이 중요합니다.</div>
    <div class="btn-row" style="margin-top:12px">
      <button class="btn btn-green" onclick="hostRestart()">🔁 같은 학생들과 다시 하기</button>
      <button class="btn btn-line" style="flex:none;width:auto;padding-left:18px;padding-right:18px" onclick="hostNewRoom()">🏠 새 방</button></div></div>`;
}
function bestStockOverall(){ let best=null; COMPANIES.forEach(c=>{ const cum=(sellAt(c.k,NROUNDS)/priceAt(c.k,1)-1)*100; if(!best||cum>best.cum) best={name:c.name,color:c.color,cum}; }); return best; }
function perfectPlay(){ let b=START; for(let rd=1;rd<=NROUNDS;rd++){ const bestK=[...COMPANIES].sort((x,y)=>RETURNS[rd][y.k]-RETURNS[rd][x.k])[0].k; const qn=Math.floor(b/priceAt(bestK,rd)); b=b+qn*(sellAt(bestK,rd)-priceAt(bestK,rd)); } return b; }

  const sub=SUBS.find(s=>s.player_id===id);
  showModal(`<h2 style="margin-bottom:6px">${esc(p.name)}</h2><div class="muted mini">보유 자산 <b class="num">${won(p.balance)}</b>${ROOM&&ROOM.stage==='round'?' · '+(sub?'✅ 제출 완료':'⏳ 아직 제출 전'):''}</div>

  try{ const code=await q(sb.rpc('issue_rejoin_code',{p_player:id}));
    if(out) out.innerHTML=`<div class="tiny muted">학생에게 알려주세요 (30분 유효 · 1회용)</div><div class="bigcode" style="margin-top:6px">${esc(code)}</div><div class="tiny muted" style="margin-top:6px">학생 화면: 방 코드 입력 → [다른 기기에서 하던 게임 이어하기] → 이름과 이 코드 입력</div>`;
  }catch(e){ if(out) out.innerHTML=`<div class="up">코드를 만들지 못했어요: ${esc(e.message)}</div>`; }
}

function openNews(round,big){

function showModal(html,title,big){
  const d=document.createElement('div'); d.className='modal-bg'+(big?' mid':''); d.onclick=e=>{ if(e.target===d) d.remove(); };
  d.innerHTML=`<div class="modal ${big?'big':''}"><div class="mh"><h3>${title||''}</h3><button class="x" onclick="this.closest('.modal-bg').remove()">×</button></div>${html}</div>`;
  document.body.appendChild(d);
}

  if(!ROOM) body=`<div class="card center"><h2 style="margin-bottom:8px">게임에 다시 연결하는 중<span class="waitdots"></span></h2><p class="muted mini">${esc(ME.name||'')} · 방 ${esc(ME.roomCode||'')}</p></div>`;
  else if(ROOM.stage==='lobby') body=stuLobby();

function readJoin(){ return { code:(el('joinCode').value||'').trim().toUpperCase(), name:(el('joinName').value||'').trim().replace(/\s+/g,' ') }; }
async function findRoom(code){ ROOM_CODE_HDR=code; const rooms=await q(sb.from('invest_rooms').select('*').eq('code',code).limit(1)); return rooms[0]||null; }
async function doJoin(){
  const {code,name}=readJoin();
  if(code.length<5){ alert('방 코드 5자리를 확인해 주세요.'); return; }
  if(!name){ alert('이름을 입력해 주세요.'); return; }
  if(!LIVE_OK){ alert('온라인 서버에 연결되어 있지 않아요.'); return; }
  if(busy) return; busy=true; const b=el('joinBtn'); if(b){ b.disabled=true; b.textContent='입장 중…'; }
  try{

async function doRejoin(){

function bindAlloc(){

  document.querySelectorAll('[data-plus]').forEach(b=>b.addEventListener('click',()=>{ const k=b.dataset.plus; localAlloc[k]=(localAlloc[k]||0)+1; clampQty(k); syncInput(k); afterQty(k); }));
  document.querySelectorAll('[data-minus]').forEach(b=>b.addEventListener('click',()=>{ const k=b.dataset.minus; localAlloc[k]=Math.max(0,(localAlloc[k]||0)-1); syncInput(k); afterQty(k); }));

      <div class="d ${cls(bal-START)}">${pctTxt(ret)} ${rk?`<span class="muted" style="font-weight:600">· 전체 ${rk.rank}위 / ${rk.n}명</span>`:''}</div></div>
    <div class="callout" style="text-align:left"><div class="t">📌 총평</div>${finalMsg(ret)}</div></div>
  ${rows?`<div class="card"><h3>라운드별 기록</h3><table class="htab"><thead><tr><th>라운드 · 산 종목</th><th>손익(원)</th><th>종료 자산(원)</th></tr></thead><tbody>${rows}</tbody></table></div>`:''}
  <div class="notice" style="margin-top:12px">4라운드 동안 가장 많이 오른 주식은 <b>${bestStockOverall().name}</b>였어요. 어떤 뉴스에서 어떤 선택을 했는지 되돌아보면 다음엔 더 잘할 수 있어요!</div>`;
}
function finalMsg(ret){
  if(ret>=50) return '뉴스와 시장의 관계를 정확히 읽었어요. 국면마다 유리한 기업으로 잘 갈아탄 결과입니다.';
  if(ret>=20) return '분산과 타이밍 감각이 훌륭해요. 위험을 관리하면서 기회도 잘 잡았습니다.';
  if(ret>=0)  return '원금을 지켰어요. 위험 관리는 좋았지만, 놓친 기회가 있었는지 라운드를 되짚어봐요.';
  if(ret>=-15)return '아쉽지만 좋은 배움! 어떤 뉴스에서 방향을 잘못 읽었는지 살펴보세요.';
  return '쓴 경험이 큰 공부예요. 금리·경기·산업 뉴스와 주가의 관계를 다시 정리해 봐요.';
}

/* ===================== DEMO (offline) ===================== */
const BOT_NAMES=['민준','서연','도윤','하은','지호','수아','예준','유나','시우','채원','건우','지민'];
function demoStart(){
  stopPolling(); ME.role='host'; ME.mode='demo'; ME.roomCode='DEMO1';
  ROOM={stage:'lobby',round:0,deadline:null};
  PLAYERS = BOT_NAMES.map((n,i)=>({id:'b'+i,name:n,balance:START,savvy:i<3}));
  SUBS=[]; demoHistory=[]; lastSig=''; render();
}
function demoBotAlloc(bot,round){
  const r=RETURNS[round]; let picks;
  if(bot.savvy){ picks=COMPANIES.filter(c=>r[c.k]>4).sort((a,b)=>r[b.k]-r[a.k]).slice(0,3); if(!picks.length) picks=[COMPANIES[0]]; }
  else { const sh=[...COMPANIES].sort(()=>Math.random()-0.5); picks=sh.slice(0,2+Math.floor(Math.random()*3)); }
  const pool=Number(bot.balance)*(0.55+Math.random()*0.45); const per=pool/picks.length;
  const a={}; picks.forEach(c=>{ a[c.k]=Math.max(1,Math.floor(per/priceAt(c.k,round))); }); return fitAlloc(a,round,Number(bot.balance));
}
function demoStartGame(){ ROOM.stage='round'; ROOM.round=1; demoInvest(1); lastSig=''; render(); }
function demoInvest(round){ SUBS=PLAYERS.map(b=>{ const alloc=demoBotAlloc(b,round); return {player_id:b.id,round,alloc,invested:costOf(alloc,round),gain:0,end_balance:0}; }); }
function demoReveal(){
  const round=ROOM.round;
  SUBS.forEach(s=>{ const p=PLAYERS.find(x=>x.id===s.player_id); const {gain}=computeGain(s.alloc,round); s.gain=gain; s.end_balance=Number(p.balance)+gain; p.balance=s.end_balance; demoHistory.push({...s}); });
  ROOM.stage='reveal'; lastSig=''; render();
}
function demoNext(){ if(ROOM.round>=NROUNDS){ ROOM.stage='final'; } else { ROOM.round++; ROOM.stage='round'; demoInvest(ROOM.round); } lastSig=''; render(); }
function demoRestart(){ PLAYERS.forEach(p=>p.balance=START); SUBS=[]; demoHistory=[]; ROOM.stage='lobby'; ROOM.round=0; lastSig=''; render(); }
function renderDemo(app){
  document.body.classList.add('host');
  const right=`<span class="pill demo">데모</span><span class="pill">진행자 화면</span>`;
  const stage=ROOM.stage; let body='';
  if(stage==='lobby') body=demoLobby();
  else if(stage==='round') body=demoRoundView();
  else if(stage==='reveal') body=hostRevealView().replace('hostNext()','demoNext()');
  else if(stage==='final') body=hostFinal().replace('hostRestart()','demoRestart()').replace('hostNewRoom()','demoStart()');
  app.innerHTML = topbar(right)+`<div class="wrap wide">${body}<div class="center" style="margin-top:18px"><a class="link tiny" onclick="ME.role=null;ME.mode=null;ROOM=null;go('#/');render()">데모 끝내기</a></div></div>`;
}
function demoLobby(){
  return `<div class="card">
    <div class="notice" style="margin-bottom:14px">🕹️ <b>데모 모드</b>예요. 가상 학생 ${PLAYERS.length}명이 자동으로 매수해요. 진행자가 되어 라운드를 넘기며 화면을 체험해 보세요.</div>
    <button class="btn btn-green btn-lg" onclick="demoStartGame()">게임 시작 · 1라운드 열기</button></div>
  <div class="card"><h3 style="margin-bottom:10px">입장한 가상 학생</h3>${playerChips(false).replace(/hostPlayerMenu\('[^']*'\)/g,'')}</div>${rulesCard()}`;
}
function demoRoundView(){
  const round=ROOM.round;
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center"><div><div class="eyebrow">${round}라운드 / ${NROUNDS}</div><h2 style="margin-top:3px">투자 접수 중</h2></div>
    <div class="center"><div class="num" style="font-size:34px;font-weight:800">${SUBS.length}<span class="muted" style="font-size:20px">/${PLAYERS.length}</span></div><div class="tiny muted">제출 완료</div></div></div>
    <div class="btn-row" style="margin-top:12px">
      <button class="btn btn-line" style="flex:none;width:auto;padding:11px 18px" onclick="openNews(${round},true)">📰 뉴스 크게 보기</button>
      <button class="btn btn-green btn-lg" onclick="demoReveal()">결과 공개 →</button></div></div>
  <div class="card"><h3 style="margin-bottom:10px">학생 현황</h3>${playerChips(true).replace(/hostPlayerMenu\('[^']*'\)/g,'')}</div>`;
}

/* ===================== boot ===================== */
(function boot(){
  const h=location.hash; const hs=fresh(LS.get(SK_HOST)), ss=fresh(LS.get(SK_STU));
  const m=h.match(/code=([A-Za-z0-9]+)/); const qcode=m?m[1].toUpperCase():'';
  if(!LIVE_OK) return render();
  if(h.startsWith('#/host') && hs) return resumeHost(hs);
  if(h.startsWith('#/play')){
    if(ss && (!qcode || qcode===ss.roomCode)) return resumeStudent(ss);
    ME.role='student'; return render();
  }
  render();
})();
</script>
