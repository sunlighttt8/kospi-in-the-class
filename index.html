:root{

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--fs);background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";letter-spacing:-.01em}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}

.wrap{max-width:480px;margin:0 auto;padding:16px 14px 210px}

.tb-bal .v{font-weight:800;font-size:15px}
.pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;background:#eef0f3;color:var(--sub)}

.hr{height:1px;background:var(--line);margin:14px 0;border:0}

.btn-green{background:var(--green);color:#fff} .btn-green:hover:not(:disabled){background:var(--green-d)}
.btn-dark{background:var(--ink);color:#fff} .btn-dark:hover:not(:disabled){filter:brightness(1.15)}
.btn-line{background:#fff;color:var(--ink);border:1.5px solid var(--line2)} .btn-line:hover:not(:disabled){background:#fafbfc}

@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important}}
</style>

const el = id => document.getElementById(id);
const co = k => COMPANIES.find(c=>c.k===k);
const round10 = n => Math.round(n/10)*10;
const fmt = n => Math.round(Number(n)||0).toLocaleString('ko-KR');
const won = n => fmt(n)+'원';
const man = n => fmt(Math.round(Number(n)/10000))+'만원';
const sgn = n => n>0?'+':'';
const cls = n => n>0?'up':(n<0?'down':'flat');
const arw = n => n>0?'▲':(n<0?'▼':'―');
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function genCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=A[Math.floor(Math.random()*A.length)];return s;}
function genSecret(){return Math.random().toString(36).slice(2)+Date.now().toString(36);}
function priceAt(k, round){ let p = co(k).price; for(let i=1;i<round;i++){ p = round10(p*(1+(RETURNS[i][k]||0)/100)); } return round10(p); }
function computeGain(alloc, round){
  const r=RETURNS[round]||{}; let gain=0, spent=0; const per={};
  COMPANIES.forEach(c=>{ const qty=Math.max(0,Math.floor(alloc[c.k]||0)); const price=priceAt(c.k,round); const ret=r[c.k]||0;
    const newP=round10(price*(1+ret/100)); const cost=qty*price; const g=qty*(newP-price);
    per[c.k]={qty,price,ret,newP,cost,gain:g}; gain+=g; spent+=cost; });
  return {gain, spent, per};
}
function joinURL(code){ return location.origin+location.pathname+'#/play?code='+code; }
function myBalance(){ return Number((myPlayer&&myPlayer.balance)!=null?myPlayer.balance:START); }

/* ===================== polling ===================== */
window.addEventListener('hashchange', ()=>{ if(!ME.role && location.hash.startsWith('#/play')){ render(); } });
function go(hash){ location.hash=hash; }
function startPolling(){ stopPolling(); const t = ME.role==='host'?tickHost:tickStudent; t(); pollTimer=setInterval(t,2000); }
function stopPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }

async function tickHost(){
  if(ME.mode!=='live') return;
  try{
    const {data:rm}=await sb.from('invest_rooms').select('*').eq('id',ME.roomId).limit(1);
    if(rm&&rm[0]) ROOM=rm[0];
    const {data:ps}=await sb.from('invest_players').select('*').eq('room_id',ME.roomId).order('created_at');
    PLAYERS=ps||[];
    if(ROOM && ROOM.round>0){ const {data:ss}=await sb.from('invest_submissions').select('*').eq('room_id',ME.roomId).eq('round',ROOM.round); SUBS=ss||[]; }
    else SUBS=[];
    paint(false);
  }catch(e){ console.warn('host tick',e); }
}
async function tickStudent(){
  if(ME.mode!=='live') return;
  try{
    const {data:rm}=await sb.from('invest_rooms').select('*').eq('id',ME.roomId).limit(1);
    if(rm&&rm[0]) ROOM=rm[0];
    const {data:me}=await sb.from('invest_players').select('*').eq('id',ME.playerId).limit(1);
    if(me&&me[0]) myPlayer=me[0];
    if(ROOM && ROOM.round>0){ const {data:s}=await sb.from('invest_submissions').select('*').eq('player_id',ME.playerId).eq('round',ROOM.round).limit(1); mySub=(s&&s[0])||null; }
    else mySub=null;
    if(ROOM && ROOM.stage==='final'){ const {data:all}=await sb.from('invest_players').select('*').eq('room_id',ME.roomId); ALLPLAYERS=all||[]; }
    paint(false);
  }catch(e){ console.warn('student tick',e); }
}
function viewSig(){
  if(ME.role==='host') return `H|${ROOM&&ROOM.stage}|${ROOM&&ROOM.round}|${PLAYERS.length}|${SUBS.length}`;
  if(ME.role==='student') return `S|${ROOM&&ROOM.stage}|${ROOM&&ROOM.round}|${mySub?1:0}|${Math.round(myBalance())}|${ALLPLAYERS.length}`;
  return 'L';
}
function paint(force){ const s=viewSig(); if(!force && s===lastSig) return; lastSig=s; render(); }

  const app=el('app');
  if(ME.mode==='demo') return renderDemo(app);
  if(ME.role==='host') return renderHost(app);
  if(ME.role==='student') return renderStudent(app);
  return renderLanding(app);
}

function hostStart(){ if(!LIVE_OK){ alert('온라인 서버에 연결되어 있지 않아 진행자 모드를 열 수 없어요. 데모 체험을 이용해 주세요.'); return; } createRoomLive(); }
async function createRoomLive(){
  if(busy) return; busy=true;
  try{
    let room=null;
    for(let i=0;i<6;i++){ const code=genCode(), secret=genSecret();
      const {data,error}=await sb.from('invest_rooms').insert({code,host_secret:secret,stage:'lobby',round:0}).select().single();
      if(!error){ room=data; ME.hostSecret=secret; break; } }
    if(!room){ alert('방 생성에 실패했어요. 다시 시도해 주세요.'); busy=false; return; }
    ME.role='host'; ME.mode='live'; ME.roomId=room.id; ME.roomCode=room.code; ROOM=room; PLAYERS=[]; SUBS=[];
    go('#/host'); lastSig=''; startPolling(); render();
  }catch(e){ alert('오류: '+e.message); }
  busy=false;
}
async function hostSetStage(stage, round){ const patch={stage}; if(round!=null) patch.round=round; await sb.from('invest_rooms').update(patch).eq('id',ME.roomId); ROOM={...ROOM,...patch}; render(); tickHost(); }
async function hostStartGame(){ await hostSetStage('round',1); }
async function hostReveal(){
  if(busy) return; busy=true;
  const btn=el('revealBtn'); if(btn){btn.disabled=true;btn.textContent='결과 집계 중…';}
  try{
    const round=ROOM.round;
    const {data:players}=await sb.from('invest_players').select('*').eq('room_id',ME.roomId);
    const {data:subs}=await sb.from('invest_submissions').select('*').eq('room_id',ME.roomId).eq('round',round);
    const byP={}; (subs||[]).forEach(s=>byP[s.player_id]=s);
    for(const p of (players||[])){
      const s=byP[p.id]; const alloc=s?(s.alloc||{}):{};
      const {gain,spent}=computeGain(alloc,round); const endBal=Number(p.balance)+gain;
      if(s){ await sb.from('invest_submissions').update({gain,end_balance:endBal,invested:spent}).eq('id',s.id); }
      else { await sb.from('invest_submissions').insert({room_id:ME.roomId,player_id:p.id,round,alloc:{},invested:0,gain:0,end_balance:endBal}); }
      await sb.from('invest_players').update({balance:endBal}).eq('id',p.id);
    }
    await sb.from('invest_rooms').update({stage:'reveal'}).eq('id',ME.roomId); ROOM={...ROOM,stage:'reveal'};
  }catch(e){ alert('집계 오류: '+e.message); }
  busy=false; lastSig=''; render(); tickHost();
}
async function hostNext(){ if(ROOM.round>=NROUNDS){ await hostSetStage('final'); } else { await hostSetStage('round', ROOM.round+1); } }
async function hostRestart(){

    await sb.from('invest_submissions').delete().eq('room_id',ME.roomId);
    const {data:ps}=await sb.from('invest_players').select('id').eq('room_id',ME.roomId);
    for(const p of (ps||[])){ await sb.from('invest_players').update({balance:START}).eq('id',p.id); }

}

function bestStockOverall(){ let best=null; COMPANIES.forEach(c=>{const sum=RETURNS[1][c.k]+RETURNS[2][c.k]+RETURNS[3][c.k]+RETURNS[4][c.k]; if(!best||sum>best.sum) best={name:c.name,color:c.color,sum};}); return best; }
function perfectPlay(){ let b=START; for(let rd=1;rd<=NROUNDS;rd++){ const best=Math.max(...COMPANIES.map(c=>RETURNS[rd][c.k])); b=b*(1+best/100);} return Math.round(b); }

function bindAlloc(){
  document.querySelectorAll('.amt').forEach(inp=>{
    inp.addEventListener('input',()=>{ const k=inp.dataset.k; setQtyFromInput(k, inp.value); afterQty(k, inp); });
  });
  document.querySelectorAll('[data-plus]').forEach(b=>b.addEventListener('click',()=>{ const k=b.dataset.plus; localAlloc[k]=(localAlloc[k]||0)+1; clampQty(k); syncInput(k); afterQty(k, el('amt-'+k)); }));
  document.querySelectorAll('[data-minus]').forEach(b=>b.addEventListener('click',()=>{ const k=b.dataset.minus; localAlloc[k]=Math.max(0,(localAlloc[k]||0)-1); syncInput(k); afterQty(k, el('amt-'+k)); }));
  document.querySelectorAll('[data-max]').forEach(b=>b.addEventListener('click',()=>{ const k=b.dataset.max; const price=priceAt(k,ROOM.round); const remain=myBalance()-(totalSpent()-(localAlloc[k]||0)*price); localAlloc[k]=Math.max(0,Math.floor(remain/price)); syncInput(k); afterQty(k, el('amt-'+k)); }));
  document.querySelectorAll('[data-info]').forEach(b=>b.addEventListener('click',()=>{ const info=el('info-'+b.dataset.info); if(info) info.classList.toggle('show'); }));
  COMPANIES.forEach(c=>updOrder(c.k)); updFooter();
}
function setQtyFromInput(k, raw){
  const price=priceAt(k,ROOM.round); let v=parseInt(raw,10); if(isNaN(v)||v<0)v=0;
  localAlloc[k] = inputMode==='shares' ? v : Math.floor(v*10000/price);
  clampQty(k);
}
function clampQty(k){ const price=priceAt(k,ROOM.round); const spent=totalSpent(); if(spent>myBalance()){ const others=spent-(localAlloc[k]||0)*price; localAlloc[k]=Math.max(0,Math.floor((myBalance()-others)/price)); } }
function syncInput(k){ const inp=el('amt-'+k); if(!inp) return; const price=priceAt(k,ROOM.round); const q=localAlloc[k]||0; inp.value = inputMode==='shares' ? (q||'') : (q?fmt(Math.round(q*price/10000)):''); }
function afterQty(k, inp){ if(inp && inputMode==='shares'){ const q=localAlloc[k]||0; if(String(q)!==String(inp.value) && !(q===0&&inp.value==='')) inp.value=q||''; } updOrder(k); updFooter(); }
function totalSpent(){ return COMPANIES.reduce((s,c)=>s+(localAlloc[c.k]||0)*priceAt(c.k,ROOM.round),0); }
function updOrder(k){ const o=el('ord-'+k); if(!o) return; const price=priceAt(k,ROOM.round); const q=localAlloc[k]||0; o.innerHTML = q>0? `${q}주 × ${fmt(price)}원 = 주문 <b>${won(q*price)}</b>` : ''; }
function updFooter(){
  const inv=totalSpent(), cash=myBalance()-inv;
  const fi=el('fInvest'), fc=el('fCash'); if(fi) fi.textContent=won(inv); if(fc) fc.textContent=won(cash);
  const bar=el('fbar'); if(bar){ bar.innerHTML=''; COMPANIES.forEach(c=>{const w=myBalance()?(localAlloc[c.k]||0)*priceAt(c.k,ROOM.round)/myBalance()*100:0; if(w>0){const s=document.createElement('span');s.style.width=w+'%';s.style.background=c.color;bar.appendChild(s);}}); }
  COMPANIES.forEach(c=>{ const box=el('co-'+c.k); if(box) box.classList.toggle('active',(localAlloc[c.k]||0)>0); });
}
async function stuSubmit(){
  if(busy) return; const spent=totalSpent();
  const btn=el('submitBtn'); if(btn){btn.disabled=true;btn.textContent='제출 중…';}
  busy=true;
  try{
    await sb.from('invest_submissions').upsert({room_id:ME.roomId,player_id:ME.playerId,round:ROOM.round,alloc:localAlloc,invested:spent,gain:0,end_balance:0},{onConflict:'player_id,round'});
    mySub={round:ROOM.round,alloc:localAlloc,invested:spent};
  }catch(e){ alert('제출 오류: '+e.message); if(btn){btn.disabled=false;btn.textContent='이 종목들로 투자 확정 →';} busy=false; return; }
  busy=false; lastSig=''; render();
}
function stuWaiting(){
  const round=ROOM.round; const alloc=(mySub&&mySub.alloc)||{};
  const picks=COMPANIES.filter(c=>(alloc[c.k]||0)>0);
  const inv=picks.reduce((s,c)=>s+(alloc[c.k]||0)*priceAt(c.k,round),0);
  const list = picks.length? picks.map(c=>`<div class="res-line"><span class="l"><span class="dot" style="background:${c.color}">${c.name[0]}</span><div><b>${c.name}</b><div class="tiny muted num">${alloc[c.k]}주 · ${won(priceAt(c.k,round))}</div></div></span><span class="rq num">${won((alloc[c.k]||0)*priceAt(c.k,round))}</span></div>`).join('')
    : `<div class="center muted mini" style="padding:14px">현금 100% 보유를 선택했어요</div>`;
  return `<div class="card center"><div class="badge-lg" style="background:var(--green)">✓</div>
    <h2 style="margin:14px 0 4px">${round}라운드 제출 완료!</h2><p class="muted mini">다른 친구들을 기다리는 중이에요.<span class="waitdots"></span></p></div>
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><h3>내 주문</h3><span class="tiny muted">매수 ${won(inv)} · 현금 ${won(myBalance()-inv)}</span></div>${list}</div>`;
}
function stuReveal(){
  const round=ROOM.round; const alloc=(mySub&&mySub.alloc)||{}; const {gain,per}=computeGain(alloc,round);
  const picks=COMPANIES.filter(c=>per[c.k].qty>0).sort((a,b)=>per[b.k].ret-per[a.k].ret);
  const list=picks.length? picks.map(c=>{const p=per[c.k];return `<div class="res-line"><span class="l"><span class="dot" style="background:${c.color}">${c.name[0]}</span><div><div style="font-weight:700">${c.name}</div><div class="tiny muted num">${p.qty}주 · ${fmt(p.price)} → ${fmt(p.newP)}원</div></div></span>
    <span class="rq"><div class="pct ${cls(p.ret)}"><span class="a">${arw(p.ret)}</span>${sgn(p.ret)}${p.ret}%</div><div class="tiny num ${cls(p.gain)}">${sgn(p.gain)}${won(p.gain)}</div></span></div>`;}).join('')
    : `<div class="center muted mini" style="padding:14px">이번 라운드는 현금만 보유했어요 (변동 없음)</div>`;
  return `<div class="card"><div class="bigres"><div class="l">${round}라운드 손익</div>
      <div class="v num ${cls(gain)}">${sgn(gain)}${won(gain)}</div><div class="d ${cls(gain)}">${arw(gain)} 보유자산 ${won(myBalance())}</div></div>
    <div class="hr"></div>${list}
    <div class="callout"><div class="t">💡 이번 라운드 해설</div>${NEWS[round].lesson}</div>
    <p class="center muted mini" style="margin-top:12px">진행자가 다음 라운드를 열 때까지 기다려요.<span class="waitdots"></span></p></div>`;
}
function stuFinal(){
  const bal=myBalance(); const ret=(bal/START-1)*100;
  let rank=1,n=ALLPLAYERS.length||1;
  if(ALLPLAYERS.length){ const s=[...ALLPLAYERS].sort((a,b)=>Number(b.balance)-Number(a.balance)); rank=s.findIndex(p=>p.id===ME.playerId)+1; }
  const msg=finalMsg(ret);
  return `<div class="card center">
    <div class="bigres"><div class="l">${esc(ME.name)} 님의 최종 자산</div>
      <div class="v num ${cls(bal-START)}">${won(bal)}</div>
      <div class="d ${cls(bal-START)}">${sgn(ret)}${ret.toFixed(1)}% <span class="muted" style="font-weight:600">· 전체 ${rank}위 / ${n}명</span></div></div>
    <div class="callout"><div class="t">📌 총평</div>${msg}</div>
    <div class="notice" style="margin-top:12px">이번 게임 최고의 주식은 <b>${bestStockOverall().name}</b>였어요. 어떤 뉴스에서 어떤 선택을 했는지 되돌아보면 다음엔 더 잘할 수 있어요!</div></div>`;
}
function finalMsg(ret){
  if(ret>=50) return '뉴스와 시장의 관계를 정확히 읽었어요. 국면마다 유리한 기업으로 잘 갈아탄 결과입니다.';
  if(ret>=20) return '분산과 타이밍 감각이 훌륭해요. 위험을 관리하면서 기회도 잘 잡았습니다.';
  if(ret>=0)  return '원금을 지켰어요. 위험 관리는 좋았지만, 놓친 기회가 있었는지 라운드를 되짚어봐요.';
  if(ret>=-15)return '아쉽지만 좋은 배움! 어떤 뉴스에서 잘못된 방향에 투자했는지 살펴보세요.';
  return '쓴 경험이 큰 공부예요. 금리·경기·산업 뉴스와 주가의 관계를 다시 정리해봐요.';
}

/* ===================== DEMO (offline) ===================== */
const BOT_NAMES=['민준','서연','도윤','하은','지호','수아','예준','유나','시우','채원'];
function demoStart(){
  ME.role='host'; ME.mode='demo'; ME.roomCode='DEMO-01'; ME.hostSecret='demo';
  ROOM={stage:'lobby',round:0};
  PLAYERS = BOT_NAMES.slice(0,8).map((n,i)=>({id:'b'+i,name:n,balance:START,is_bot:true,savvy:i<3}));
  SUBS=[]; demoHistory=[]; stopPolling(); lastSig=''; render();
}
function demoBotAlloc(bot,round){
  const r=RETURNS[round]; let picks;
  if(bot.savvy){ picks=COMPANIES.filter(c=>r[c.k]>4).sort((a,b)=>r[b.k]-r[a.k]).slice(0,3); if(!picks.length) picks=[COMPANIES[Math.floor(Math.random()*COMPANIES.length)]]; }
  else { const sh=[...COMPANIES].sort(()=>Math.random()-0.5); picks=sh.slice(0,2+Math.floor(Math.random()*3)); }
  const pool=Number(bot.balance)*(0.55+Math.random()*0.45); const spendPer=pool/picks.length;
  const a={}; picks.forEach(c=>{ const price=priceAt(c.k,round); a[c.k]=Math.max(1,Math.floor(spendPer/price)); }); return a;
}
function demoStartGame(){ ROOM.stage='round'; ROOM.round=1; demoInvest(1); lastSig=''; render(); }
function demoInvest(round){ SUBS = PLAYERS.map(b=>{const alloc=demoBotAlloc(b,round);const {spent}=computeGain(alloc,round);return {player_id:b.id,round,alloc,invested:spent};}); }
function demoReveal(){
  const round=ROOM.round; const byP={}; SUBS.forEach(s=>byP[s.player_id]=s);
  PLAYERS.forEach(p=>{const s=byP[p.id];const {gain}=computeGain(s?s.alloc:{},round);p.balance=Number(p.balance)+gain;
    demoHistory.push({player_id:p.id,round,alloc:s?s.alloc:{},gain,end_balance:p.balance});});
  ROOM.stage='reveal'; lastSig=''; render();
}
function demoNext(){ if(ROOM.round>=NROUNDS){ ROOM.stage='final'; } else { ROOM.round++; ROOM.stage='round'; demoInvest(ROOM.round); } lastSig=''; render(); }
function demoRestart(){ PLAYERS.forEach(p=>p.balance=START); SUBS=[]; demoHistory=[]; ROOM.stage='lobby'; ROOM.round=0; lastSig=''; render(); }

function renderDemo(app){
  const right=`<span class="pill demo">데모</span><span class="pill">진행자 시점</span>`;
  const stage=ROOM.stage; let body='';
  if(stage==='lobby') body=demoLobby();
  else if(stage==='round') body=demoRoundView();
  else if(stage==='reveal') body=hostRevealView().replace('hostNext()','demoNext()');
  else if(stage==='final') body=hostFinal().replace('hostRestart()','demoRestart()').replace('location.reload()','demoStart()');
  app.innerHTML = topbar(right)+`<div class="wrap wide">${body}</div>`;
}
function demoLobby(){
  const plist=PLAYERS.map((p,i)=>`<div class="prow"><span class="rk">${i+1}</span><span class="pn">${esc(p.name)} <span class="tiny muted">(가상 학생)</span></span><span class="tagx tag-done">입장</span></div>`).join('');
  return `<div class="card">
    <div class="notice" style="margin-bottom:14px">🕹️ <b>데모 모드</b>입니다. 가상 학생 8명이 자동으로 매수해요. 진행자가 되어 라운드를 넘기며 대시보드를 체험해 보세요.</div>
    <div class="center"><div class="bigcode" style="font-size:28px">DEMO-01</div></div>
    <button class="btn btn-green btn-lg" style="margin-top:6px" onclick="demoStartGame()">게임 시작 · 1라운드 열기</button>
    <button class="btn btn-line btn-sm" style="margin-top:10px" onclick="demoStudentPreview(1)">🎓 학생이 보는 화면 미리보기</button></div>
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h3>입장한 가상 학생</h3><span class="pill">${PLAYERS.length}명</span></div><div class="plist">${plist}</div></div>`;
}
function demoRoundView(){
  const round=ROOM.round; const done=SUBS.length,total=PLAYERS.length;
  const ranked=[...PLAYERS].sort((a,b)=>Number(b.balance)-Number(a.balance));
  const rows=ranked.map((p,i)=>`<div class="prow"><span class="rk ${i<3?'top':''}">${i+1}</span><span class="pn">${esc(p.name)}</span><span class="pb num">${won(p.balance)}</span><span class="tagx tag-done">제출완료</span></div>`).join('');
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center"><div><div class="eyebrow">진행 중</div><h2 style="margin-top:3px">${round}라운드 · 투자 접수</h2></div>
    <div class="center"><div class="num" style="font-size:26px;font-weight:800">${done}<span class="muted" style="font-size:16px">/${total}</span></div><div class="tiny muted">제출</div></div></div>
    <div class="btn-row" style="margin-top:12px">
      <button class="btn btn-line btn-sm" style="flex:none;width:auto;padding:11px 16px" onclick="openNews(${round})">📰 뉴스</button>
      <button class="btn btn-line btn-sm" style="flex:none;width:auto;padding:11px 16px" onclick="demoStudentPreview(${round})">🎓 학생화면</button>
      <button class="btn btn-green" onclick="demoReveal()">결과 공개 →</button></div></div>
  <div class="card"><h3 style="margin-bottom:10px">실시간 현황 (자산순)</h3><div class="plist">${rows}</div></div>`;
}
function demoStudentPreview(round){
  const newsHtml=NEWS[round].items.slice(0,4).map(n=>`<div class="news-item"><span class="sec">${n.sec}</span><div class="hd">${n.hd}</div><div class="bd">${n.bd}</div></div>`).join('');
  const coHtml=COMPANIES.slice(0,5).map(c=>{const price=priceAt(c.k,round);return `<div class="co"><div class="co-top"><span class="badge" style="background:${c.color}">${c.name[0]}</span><div class="meta"><div class="nm">${c.name}</div><div class="tag">${c.sector}</div></div><div class="px"><div class="p num">${fmt(price)}<span style="font-size:11px">원</span></div><div class="pl">현재가</div></div></div></div>`;}).join('');
  showModal(`<div class="notice" style="margin-bottom:12px">학생 휴대폰에 보이는 화면 예시예요 (일부만 표시).</div>
    <div class="paper-head"><div class="k">KOSPI IN THE CLASS</div><div class="t">코스피일보 · ${round}라운드</div></div>${newsHtml}
    <h3 style="margin:14px 0 8px">💰 매수 (10개 기업 중 일부)</h3>${coHtml}
    <div class="notice" style="margin-top:10px">실제 화면에선 주수/금액을 입력하면 주문금액이 계산되고, 하단에 남은 현금과 ‘투자 확정’ 버튼이 고정돼요.</div>`);
}

/* boot */
if(location.hash.startsWith('#/play') && !ME.role){ renderJoin(el('app')); } else { render(); }
</script>
