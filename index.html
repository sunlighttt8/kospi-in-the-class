<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>코스피 인 더 클래스 · 모의투자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.min.css">
<style>
/* =========================================================================
   코스피 인 더 클래스 — 청소년 모의투자 (Kahoot 방식)
   - 진행자(호스트) + 학생 + 오프라인 데모, 한 파일.
   - 라이브 모드는 Supabase(방코드로 동시접속) 사용. 폴링(2초)으로 안정 동작.
   - 게임 콘텐츠(기업/뉴스/수익률)는 아래 CONFIG DATA 블록에서 수정 가능.
   ========================================================================= */
:root{
  --bg:#f4f5f7; --card:#ffffff; --ink:#17181c; --sub:#5a6270; --faint:#98a0ac;
  --line:#e8eaed; --line2:#dfe2e6;
  --up:#e5322d; --up-bg:#fdecec; --down:#1b64da; --down-bg:#eaf1fd; --flat:#8a929e;
  --green:#03c75a; --green-d:#02b350; --green-bg:#e7f9ef;
  --gold:#f0a500;
  --fs:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --shadow:0 1px 2px rgba(20,22,30,.04),0 4px 16px -8px rgba(20,22,30,.10);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--fs);background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";letter-spacing:-.01em}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}

#app{min-height:100%}
.wrap{max-width:480px;margin:0 auto;padding:16px 14px 120px}
.wrap.wide{max-width:920px}

/* top bar */
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);}
.topbar .in{max-width:920px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;letter-spacing:-.02em}
.logo .mk{font-weight:800;font-size:12px;color:#fff;background:var(--ink);border-radius:5px;padding:3px 6px;letter-spacing:.02em}
.logo .g{color:var(--green)}
.tb-right{display:flex;align-items:center;gap:14px}
.tb-bal{text-align:right}
.tb-bal .l{font-size:10px;color:var(--faint);letter-spacing:.03em}
.tb-bal .v{font-weight:800;font-size:16px}
.pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;background:#eef0f3;color:var(--sub)}
.pill.live{background:var(--up-bg);color:var(--up)}
.pill.live::before{content:"●";font-size:8px;margin-right:4px;vertical-align:1px}
.pill.demo{background:#fff5e0;color:#a9760a}

/* cards / type */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.card + .card{margin-top:12px}
h1{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
h2{font-size:18px;font-weight:800;letter-spacing:-.02em}
h3{font-size:15px;font-weight:800;letter-spacing:-.01em}
.muted{color:var(--sub)} .tiny{font-size:12px} .mini{font-size:13px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.02em;color:var(--green)}
.hr{height:1px;background:var(--line);margin:14px 0;border:0}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;cursor:pointer;
  font-family:var(--fs);font-weight:800;font-size:16px;border-radius:12px;padding:15px 18px;transition:filter .12s,transform .06s,background .12s}
.btn:active{transform:translateY(1px)} .btn:disabled{opacity:.5;cursor:not-allowed}
.btn-green{background:var(--green);color:#fff} .btn-green:hover:not(:disabled){background:var(--green-d)}
.btn-dark{background:var(--ink);color:#fff} .btn-dark:hover:not(:disabled){filter:brightness(1.15)}
.btn-line{background:#fff;color:var(--ink);border:1.5px solid var(--line2)} .btn-line:hover:not(:disabled){background:#fafbfc}
.btn-sm{padding:11px 14px;font-size:14px;border-radius:10px}
.btn-row{display:flex;gap:10px}

input.field{width:100%;background:#fff;border:1.5px solid var(--line2);border-radius:11px;color:var(--ink);
  padding:14px;font-family:var(--fs);font-size:16px;font-weight:600;transition:border .12s}
input.field:focus{outline:none;border-color:var(--green)}
input.field::placeholder{color:var(--faint);font-weight:500}
.label{font-size:13px;font-weight:700;color:var(--sub);margin-bottom:7px;display:block}
.code-field{text-align:center;letter-spacing:.35em;font-weight:800;font-size:22px;text-transform:uppercase}

/* landing choices */
.choice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);
  border-radius:14px;padding:16px;cursor:pointer;transition:border .12s,transform .06s,box-shadow .12s;box-shadow:var(--shadow)}
.choice:hover{border-color:var(--green);transform:translateY(-1px)}
.choice:active{transform:translateY(0)}
.choice .ic{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:22px}
.choice .t{flex:1;min-width:0}
.choice .t b{font-size:16px;font-weight:800;display:block}
.choice .t span{font-size:12.5px;color:var(--sub)}
.choice .ar{color:var(--faint);font-size:18px}

/* segmented */
.seg{display:flex;background:#eef0f3;border-radius:11px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;border:none;background:transparent;font-family:var(--fs);font-weight:800;font-size:14px;color:var(--sub);
  padding:9px;border-radius:8px;cursor:pointer;transition:.12s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* news */
.news-item{border-bottom:1px solid var(--line);padding:13px 0}
.news-item:first-child{padding-top:2px} .news-item:last-child{border-bottom:none;padding-bottom:2px}
.news-item .sec{display:inline-block;font-size:11px;font-weight:800;color:var(--sub);background:#f0f2f5;border-radius:5px;padding:2px 7px;margin-bottom:6px}
.news-item .hd{font-weight:800;font-size:15px;letter-spacing:-.01em;line-height:1.35;margin-bottom:4px}
.news-item .bd{font-size:13.5px;color:var(--sub);line-height:1.55}
.paper-head{text-align:center;border-top:2.5px solid var(--ink);border-bottom:1px solid var(--ink);padding:9px 0;margin-bottom:12px}
.paper-head .k{font-size:10px;font-weight:700;letter-spacing:.28em;color:var(--sub)}
.paper-head .t{font-size:20px;font-weight:800;letter-spacing:.06em}

/* company allocation rows */
.co{border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:9px;transition:border .12s,background .12s}
.co.active{border-color:var(--green);background:var(--green-bg)}
.co-top{display:flex;align-items:center;gap:11px}
.co .badge{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px}
.co .meta{flex:1;min-width:0}
.co .nm{font-weight:800;font-size:15px;letter-spacing:-.01em}
.co .tag{font-size:11.5px;color:var(--sub)}
.co .inbox{flex:none;display:flex;align-items:center;gap:5px}
.co input.amt{width:82px;background:#fff;border:1.5px solid var(--line2);border-radius:9px;padding:8px 9px;
  font-family:var(--fs);font-weight:800;font-size:15px;text-align:right;color:var(--ink);-moz-appearance:textfield}
.co input.amt:focus{outline:none;border-color:var(--green)}
.co input.amt::-webkit-outer-spin-button,.co input.amt::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.co .won{font-size:11px;color:var(--faint);font-weight:700}
.co-tools{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:#fff;color:var(--sub);font-family:var(--fs);font-weight:800;font-size:11.5px;
  border-radius:20px;padding:5px 10px;cursor:pointer;transition:.12s}
.chip:hover{border-color:var(--green);color:var(--green)}
.chip.info{margin-left:auto;border-style:dashed}
.co-info{margin-top:10px;padding:11px;background:#f7f8fa;border-radius:9px;font-size:12.5px;color:var(--sub);line-height:1.6;display:none}
.co-info.show{display:block}
.co-info b{color:var(--ink)} .co-info ul{margin:5px 0 0 15px} .co-info li{margin:2px 0}

/* sticky invest footer */
.footer{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:11px 14px calc(11px + env(safe-area-inset-bottom));}
.footer .in{max-width:480px;margin:0 auto}
.footer .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;font-size:13px}
.footer .row .v{font-weight:800;font-size:16px}
.footer .cash{color:var(--green)}
.allocbar{height:8px;border-radius:5px;background:#eef0f3;overflow:hidden;display:flex;margin-bottom:11px}
.allocbar span{height:100%}

/* result table */
.rtab{width:100%;border-collapse:collapse}
.rtab th,.rtab td{text-align:left;padding:11px 6px;border-bottom:1px solid var(--line);font-size:13.5px}
.rtab th{font-size:11.5px;color:var(--faint);font-weight:700}
.rtab td.r{text-align:right} .rtab .co-cell{display:flex;align-items:center;gap:9px}
.rtab .dot{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;flex:none}
.pct{font-weight:800;font-variant-numeric:tabular-nums}
.pct .a{font-size:11px;margin-right:2px}

/* my result cards */
.res-line{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.res-line:last-child{border-bottom:none}
.res-line .l{display:flex;align-items:center;gap:9px}
.res-line .rq{text-align:right}
.bigres{text-align:center;padding:20px 0 6px}
.bigres .l{font-size:12px;color:var(--sub)}
.bigres .v{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
.bigres .d{font-weight:800;font-size:16px;margin-top:4px}
.callout{background:#f7f8fa;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px;font-size:13.5px;line-height:1.6;color:var(--sub)}
.callout b{color:var(--ink)}
.callout .t{font-weight:800;color:var(--gold);font-size:12.5px;margin-bottom:5px}

/* dashboard */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;text-align:center}
.stat .l{font-size:11px;color:var(--sub);font-weight:700}
.stat .v{font-size:22px;font-weight:800;margin-top:3px}
.plist{display:flex;flex-direction:column;gap:7px}
.prow{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.prow .rk{flex:none;width:26px;text-align:center;font-weight:800;font-size:14px;color:var(--sub)}
.prow .rk.top{color:var(--gold)}
.prow .pn{flex:1;min-width:0;font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .pb{font-weight:800;font-size:14.5px;text-align:right}
.prow .tagx{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:20px}
.tag-wait{background:#f0f2f5;color:var(--faint)} .tag-done{background:var(--green-bg);color:var(--green-d)}
.qrbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center}
.qrbox img{width:150px;height:150px;border:1px solid var(--line);border-radius:12px;background:#fff}
.bigcode{font-size:40px;font-weight:800;letter-spacing:.18em;text-align:center;background:#f7f8fa;border:2px dashed var(--line2);
  border-radius:14px;padding:16px;margin:2px 0}
.joinurl{font-size:12px;color:var(--sub);word-break:break-all;background:#f7f8fa;border-radius:8px;padding:9px 11px;text-align:center}

.spacer{height:12px}
.center{text-align:center}
.badge-lg{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px;margin:0 auto}
.waitdots::after{content:"";animation:wd 1.4s steps(4,end) infinite}
@keyframes wd{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.notice{font-size:12.5px;color:var(--sub);background:#f7f8fa;border-radius:10px;padding:11px 13px;line-height:1.55}
.link{color:var(--green);font-weight:700;cursor:pointer;text-decoration:none}
:focus-visible{outline:2.5px solid var(--green);outline-offset:2px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,17,22,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal{background:var(--bg);width:100%;max-width:480px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px 30px}
.modal .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.modal .x{border:none;background:#eef0f3;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;font-weight:700;color:var(--sub)}

@media (max-width:400px){ .co input.amt{width:74px} .bigcode{font-size:32px} }
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important}}
</style>
</head>

function genCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=A[Math.floor(Math.random()*A.length)];return s;}
function genSecret(){return Math.random().toString(36).slice(2)+Date.now().toString(36);}
function computeGain(alloc, round){
  const r=RETURNS[round]||{}; let gain=0, invested=0; const per={};
  COMPANIES.forEach(c=>{const amt=Math.max(0,Math.round(alloc[c.k]||0));const ret=r[c.k]||0;const g=Math.round(amt*ret/100);per[c.k]={amt,ret,gain:g};gain+=g;invested+=amt;});
  return {gain,invested,per};
}
function joinURL(code){ const base=location.origin+location.pathname; return base+'#/play?code='+code; }
function myBalance(){ return Number((myPlayer&&myPlayer.balance)!=null?myPlayer.balance:START); }

/* ===================== router ===================== */

/* ===================== polling ===================== */
function startPolling(){
  stopPolling();
  const tick = ME.role==='host'? tickHost : tickStudent;
  tick();
  pollTimer = setInterval(tick, 2000);
}
function stopPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }

async function tickHost(){
  if(ME.mode!=='live') return;
  try{
    const {data:rm}=await sb.from('invest_rooms').select('*').eq('id',ME.roomId).limit(1);
    if(rm&&rm[0]) ROOM=rm[0];
    const {data:ps}=await sb.from('invest_players').select('*').eq('room_id',ME.roomId).order('created_at');
    PLAYERS=ps||[];
    if(ROOM && ROOM.round>0){ const {data:ss}=await sb.from('invest_submissions').select('*').eq('room_id',ME.roomId).eq('round',ROOM.round); SUBS=ss||[]; }
    else SUBS=[];
    paint(false);
  }catch(e){ console.warn('host tick',e); }
}
async function tickStudent(){
  if(ME.mode!=='live') return;
  try{
    const {data:rm}=await sb.from('invest_rooms').select('*').eq('id',ME.roomId).limit(1);
    if(rm&&rm[0]) ROOM=rm[0];
    const {data:me}=await sb.from('invest_players').select('*').eq('id',ME.playerId).limit(1);
    if(me&&me[0]) myPlayer=me[0];
    if(ROOM && ROOM.round>0){ const {data:s}=await sb.from('invest_submissions').select('*').eq('player_id',ME.playerId).eq('round',ROOM.round).limit(1); mySub=(s&&s[0])||null; }
    else mySub=null;
    if(ROOM && ROOM.stage==='final'){ const {data:all}=await sb.from('invest_players').select('*').eq('room_id',ME.roomId); ALLPLAYERS=all||[]; }
    paint(false);
  }catch(e){ console.warn('student tick',e); }
}

/* signature-gated repaint (protects student inputs) */
function viewSig(){
  if(ME.role==='host') return `H|${ROOM&&ROOM.stage}|${ROOM&&ROOM.round}|${PLAYERS.length}|${SUBS.length}`;
  if(ME.role==='student') return `S|${ROOM&&ROOM.stage}|${ROOM&&ROOM.round}|${mySub?1:0}|${Math.round(myBalance())}|${ALLPLAYERS.length}`;
  return 'L';
}
function paint(force){ const s=viewSig(); if(!force && s===lastSig) return; lastSig=s; render(); }

/* ===================== render dispatcher ===================== */
function render(){
  const app=el('app');
  if(ME.mode==='demo') return renderDemo(app);
  if(ME.role==='host') return renderHost(app);
  if(ME.role==='student') return renderStudent(app);
  return renderLanding(app);
}

/* ===================== HOST ===================== */
function hostStart(){
  if(!LIVE_OK){ alert('온라인 서버에 연결되어 있지 않아 진행자 모드를 열 수 없어요. 데모 체험을 이용해 주세요.'); return; }
  createRoomLive();
}
async function createRoomLive(){
  if(busy) return; busy=true;
  try{
    let room=null;
    for(let i=0;i<6;i++){
      const code=genCode(), secret=genSecret();
      const {data,error}=await sb.from('invest_rooms').insert({code,host_secret:secret,stage:'lobby',round:0}).select().single();
      if(!error){ room=data; ME.hostSecret=secret; break; }
    }
    if(!room){ alert('방 생성에 실패했어요. 다시 시도해 주세요.'); busy=false; return; }
    ME.role='host'; ME.mode='live'; ME.roomId=room.id; ME.roomCode=room.code;
    ROOM=room; PLAYERS=[]; SUBS=[];
    go('#/host'); lastSig=''; startPolling(); render();
  }catch(e){ alert('오류: '+e.message); }
  busy=false;
}
async function hostSetStage(stage, round){
  const patch={stage}; if(round!=null) patch.round=round;
  await sb.from('invest_rooms').update(patch).eq('id',ME.roomId);
  ROOM={...ROOM,...patch}; render(); tickHost();
}
async function hostStartGame(){ await hostSetStage('round',1); }
async function hostReveal(){
  if(busy) return; busy=true;
  const btn=el('revealBtn'); if(btn){btn.disabled=true;btn.textContent='결과 집계 중…';}
  try{
    const round=ROOM.round;
    const {data:players}=await sb.from('invest_players').select('*').eq('room_id',ME.roomId);
    const {data:subs}=await sb.from('invest_submissions').select('*').eq('room_id',ME.roomId).eq('round',round);
    const byP={}; (subs||[]).forEach(s=>byP[s.player_id]=s);
    for(const p of (players||[])){
      const s=byP[p.id]; const alloc=s?(s.alloc||{}):{};
      const {gain,invested}=computeGain(alloc,round);
      const endBal=Number(p.balance)+gain;
      if(s){ await sb.from('invest_submissions').update({gain,end_balance:endBal,invested}).eq('id',s.id); }
      else { await sb.from('invest_submissions').insert({room_id:ME.roomId,player_id:p.id,round,alloc:{},invested:0,gain:0,end_balance:endBal}); }
      await sb.from('invest_players').update({balance:endBal}).eq('id',p.id);
    }
    await sb.from('invest_rooms').update({stage:'reveal'}).eq('id',ME.roomId);
    ROOM={...ROOM,stage:'reveal'};
  }catch(e){ alert('집계 오류: '+e.message); }
  busy=false; lastSig=''; render(); tickHost();
}
async function hostNext(){
  if(ROOM.round>=NROUNDS){ await hostSetStage('final'); }
  else { await hostSetStage('round', ROOM.round+1); }
}

function hostFinal(){
  const ranked=[...PLAYERS].sort((a,b)=>Number(b.balance)-Number(a.balance));
  const avg = ranked.length? ranked.reduce((s,p)=>s+Number(p.balance),0)/ranked.length : START;
  const best = bestStockOverall(); const perfect = perfectPlay();
  const rows=ranked.map((p,i)=>{const ret=(Number(p.balance)/START-1)*100;return `<div class="prow"><span class="rk ${i<3?'top':''}">${i===0?'🏆':i+1}</span>
    <span class="pn">${esc(p.name)}</span>
    <span class="pb num">${fmt(p.balance)}<span class="tiny muted">만원</span> <span class="tiny ${cls(ret)}">${sgn(ret)}${ret.toFixed(1)}%</span></span></div>`;}).join('');
  return `
  <div class="card center">
    <div class="eyebrow">최종 결과</div>
    <h2 style="margin:6px 0 12px">🏁 우리 반 투자 랭킹</h2>

      <div class="stat"><div class="l">참가 인원</div><div class="v num">${ranked.length}</div></div>
      <div class="stat"><div class="l">반 평균 수익률</div><div class="v num ${cls(avg-START)}">${sgn((avg/START-1)*100)}${((avg/START-1)*100).toFixed(1)}%</div></div>
      <div class="stat"><div class="l">최고 수익 종목</div><div class="v" style="font-size:16px;color:${best.color}">${best.name}</div></div>
    </div>
  </div>
  <div class="card"><div class="plist">${rows||'<div class="center muted">참가자 없음</div>'}</div></div>
  <div class="card">
    <div class="callout"><div class="t">📌 마무리 코멘트</div>
    이번 게임 최고의 주식은 <b style="color:${best.color}">${best.name}</b>(4라운드 누적 <b>${sgn(best.sum)}${best.sum}%</b>)였어요. 매 라운드 최선의 종목으로 완벽히 갈아탔다면 <b>${fmt(perfect)}만원</b>까지 가능했습니다. 뉴스를 읽고 흐름을 따라간 사람일수록 유리했다는 걸 확인해 보세요.</div>
    <button class="btn btn-line" style="margin-top:12px" onclick="location.reload()">새 게임 시작</button>
  </div>`;
}
function bestStockOverall(){
  let best=null;
  COMPANIES.forEach(c=>{const sum=RETURNS[1][c.k]+RETURNS[2][c.k]+RETURNS[3][c.k]+RETURNS[4][c.k]; if(!best||sum>best.sum) best={name:c.name,color:c.color,sum};});
  return best;
}
function perfectPlay(){ let b=START; for(let rd=1;rd<=NROUNDS;rd++){ const best=Math.max(...COMPANIES.map(c=>RETURNS[rd][c.k])); b=b*(1+best/100);} return Math.round(b); }

function bindAlloc(){
  document.querySelectorAll('.amt').forEach(inp=>{
    inp.addEventListener('input',()=>{ const k=inp.dataset.k; let v=parseInt(inp.value,10); if(isNaN(v)||v<0)v=0; localAlloc[k]=v; clampAlloc(k,inp); updAllocUI(); });
  });
  document.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>{ const k=b.dataset.add; localAlloc[k]=(localAlloc[k]||0)+parseInt(b.dataset.v,10); const inp=el('amt-'+k); clampAlloc(k,inp); inp.value=localAlloc[k]||''; updAllocUI(); }));
  document.querySelectorAll('[data-max]').forEach(b=>b.addEventListener('click',()=>{ const k=b.dataset.max; const rem=remaining()+ (localAlloc[k]||0); localAlloc[k]=Math.max(0,rem); const inp=el('amt-'+k); inp.value=localAlloc[k]||''; updAllocUI(); }));
  document.querySelectorAll('[data-info]').forEach(b=>b.addEventListener('click',()=>{ const info=el('info-'+b.dataset.info); if(info) info.classList.toggle('show'); }));
  updAllocUI();
}
function invested(){ return COMPANIES.reduce((s,c)=>s+(localAlloc[c.k]||0),0); }
function remaining(){ return myBalance()-invested(); }
function clampAlloc(k,inp){ // ensure total doesn't exceed balance
  let total=invested();
  if(total>myBalance()){ const others=total-(localAlloc[k]||0); localAlloc[k]=Math.max(0,myBalance()-others); if(inp) inp.value=localAlloc[k]||''; }
}
function updAllocUI(){
  const inv=invested(), cash=myBalance()-inv;

  const bar=el('fbar'); if(bar){ bar.innerHTML=''; COMPANIES.forEach(c=>{const w=myBalance()?(localAlloc[c.k]||0)/myBalance()*100:0; if(w>0){const s=document.createElement('span');s.style.width=w+'%';s.style.background=c.color;bar.appendChild(s);}}); }

}

  return `<div class="card center">
    <div class="badge-lg" style="background:var(--green)">✓</div>
    <h2 style="margin:14px 0 4px">${round}라운드 제출 완료!</h2>
    <p class="muted mini">다른 친구들을 기다리는 중이에요.<span class="waitdots"></span></p>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><h3>내 포트폴리오</h3><span class="tiny muted">투자 ${fmt(inv)}만원 · 현금 ${fmt(myBalance()-inv)}만원</span></div>
    ${list}
  </div>`;
}
function stuReveal(){
  const round=ROOM.round; const alloc=(mySub&&mySub.alloc)||{};
  const {gain,per}=computeGain(alloc,round);
  const startBal=myBalance()-gain; // current balance already includes this round's gain
  const invested=COMPANIES.reduce((s,c)=>s+(per[c.k].amt),0);
  const picks=COMPANIES.filter(c=>per[c.k].amt>0).sort((a,b)=>per[b.k].ret-per[a.k].ret);
  const list=picks.length? picks.map(c=>{const p=per[c.k];return `<div class="res-line"><span class="l"><span class="dot" style="background:${c.color}">${c.name[0]}</span><div><div style="font-weight:700">${c.name}</div><div class="tiny muted num">${fmt(p.amt)}만원 투자</div></div></span>
    <span class="rq"><div class="pct ${cls(p.ret)}"><span class="a">${arw(p.ret)}</span>${sgn(p.ret)}${p.ret}%</div><div class="tiny num ${cls(p.gain)}">${sgn(p.gain)}${fmt(p.gain)}만원</div></span></div>`;}).join('')
    : `<div class="center muted mini" style="padding:14px">이번 라운드는 현금만 보유했어요 (변동 없음)</div>`;
  return `<div class="card">
    <div class="bigres"><div class="l">${round}라운드 손익</div>
      <div class="v num ${cls(gain)}">${sgn(gain)}${fmt(gain)}<span style="font-size:.4em;color:var(--sub)"> 만원</span></div>
      <div class="d ${cls(gain)}">${arw(gain)} 보유자산 ${fmt(myBalance())}만원</div></div>
    <div class="hr"></div>
    ${list}
    <div class="callout"><div class="t">💡 이번 라운드 해설</div>${NEWS[round].lesson}</div>
    <p class="center muted mini" style="margin-top:12px">진행자가 다음 라운드를 열 때까지 기다려요.<span class="waitdots"></span></p>
  </div>`;
}
function stuFinal(){
  const bal=myBalance(); const ret=(bal/START-1)*100;
  let rank=1, n=ALLPLAYERS.length||1;
  if(ALLPLAYERS.length){ const sorted=[...ALLPLAYERS].sort((a,b)=>Number(b.balance)-Number(a.balance)); rank=sorted.findIndex(p=>p.id===ME.playerId)+1; }
  const g=grade(ret);
  return `<div class="card center">
    <span class="tagx" style="background:${g.bg};color:${g.c};font-size:12px;padding:6px 14px">${g.label}</span>
    <div class="bigres"><div class="l">${esc(ME.name)} 님의 최종 자산</div>
      <div class="v num ${cls(bal-START)}">${fmt(bal)}<span style="font-size:.4em;color:var(--sub)"> 만원</span></div>
      <div class="d ${cls(bal-START)}">${sgn(ret)}${ret.toFixed(1)}% <span class="muted" style="font-weight:600">· 전체 ${rank}위 / ${n}명</span></div></div>
    <div class="callout"><div class="t">📌 총평</div>${g.msg}</div>
    <div class="notice" style="margin-top:12px">이번 게임 최고의 주식은 <b>${bestStockOverall().name}</b>였어요. 어떤 뉴스에서 어떤 선택을 했는지 되돌아보면 다음엔 더 잘할 수 있어요!</div>
  </div>`;
}
function grade(ret){
  if(ret>=50) return {label:'S · 투자 고수',c:'var(--up)',bg:'var(--up-bg)',msg:'뉴스와 시장의 관계를 정확히 읽었어요. 국면마다 유리한 기업으로 잘 갈아탄 결과입니다.'};
  if(ret>=20) return {label:'A · 우수',c:'var(--up)',bg:'var(--up-bg)',msg:'분산과 타이밍 감각이 훌륭해요. 위험을 관리하면서 기회도 잘 잡았습니다.'};
  if(ret>=0)  return {label:'B · 선방',c:'var(--gold)',bg:'#fff5e0',msg:'원금을 지켰어요. 위험 관리는 좋았지만, 놓친 기회가 있었는지 라운드를 되짚어봐요.'};
  if(ret>=-15)return {label:'C · 경험치 획득',c:'var(--down)',bg:'var(--down-bg)',msg:'아쉽지만 좋은 배움! 어떤 뉴스에서 잘못된 방향에 투자했는지 살펴보세요.'};
  return {label:'D · 복습 필요',c:'var(--down)',bg:'var(--down-bg)',msg:'쓴 경험이 큰 공부예요. 금리·경기·산업 뉴스와 주가의 관계를 다시 정리해봐요.'};
}

/* ===================== DEMO (offline) ===================== */
const BOT_NAMES=['민준','서연','도윤','하은','지호','수아','예준','유나','시우','채원'];
function demoStart(){
  ME.role='host'; ME.mode='demo'; ME.roomCode='DEMO-01'; ME.hostSecret='demo';
  ROOM={stage:'lobby',round:0};
  PLAYERS = BOT_NAMES.slice(0,8).map((n,i)=>({id:'b'+i,name:n,balance:START,is_bot:true,savvy:i<3}));
  SUBS=[]; stopPolling(); lastSig=''; render();
}
function demoBotAlloc(bot,round){
  const r=RETURNS[round]; let picks;
  if(bot.savvy){ picks=COMPANIES.filter(c=>r[c.k]>4).sort((a,b)=>r[b.k]-r[a.k]).slice(0,3); if(!picks.length) picks=[COMPANIES[Math.floor(Math.random()*COMPANIES.length)]]; }
  else { const sh=[...COMPANIES].sort(()=>Math.random()-0.5); picks=sh.slice(0,2+Math.floor(Math.random()*3)); }
  const pool=Number(bot.balance)*(0.55+Math.random()*0.45); const per=Math.max(10,Math.floor(pool/picks.length/10)*10);
  const a={}; picks.forEach(c=>a[c.k]=per); return a;
}
function demoStartGame(){ ROOM.stage='round'; ROOM.round=1; demoInvestRound(1); lastSig=''; render(); }
function demoInvestRound(round){ SUBS = PLAYERS.map(b=>{const alloc=demoBotAlloc(b,round);const {invested}=computeGain(alloc,round);return {player_id:b.id,round,alloc,invested};}); }
function demoReveal(){
  const round=ROOM.round; const byP={}; SUBS.forEach(s=>byP[s.player_id]=s);
  PLAYERS.forEach(p=>{const s=byP[p.id];const {gain}=computeGain(s?s.alloc:{},round);p.balance=Number(p.balance)+gain; if(s){s.gain=gain;s.end_balance=p.balance;}});
  ROOM.stage='reveal'; lastSig=''; render();
}
function demoNext(){ if(ROOM.round>=NROUNDS){ ROOM.stage='final'; } else { ROOM.round++; ROOM.stage='round'; demoInvestRound(ROOM.round); } lastSig=''; render(); }
function demoExit(){ location.reload(); }

function renderDemo(app){
  const right=`<span class="pill demo">데모</span><span class="pill">진행자 시점</span>`;
  const stage=ROOM.stage; let body='';
  if(stage==='lobby') body=demoLobby();
  else if(stage==='round') body=demoRoundView();
  else if(stage==='reveal') body=hostRevealView().replace('hostNext()','demoNext()');
  else if(stage==='final') body=hostFinal().replace('location.reload()','demoExit()');
  app.innerHTML = topbar(right)+`<div class="wrap wide">${body}</div>`;
}
function demoLobby(){
  const plist=PLAYERS.map((p,i)=>`<div class="prow"><span class="rk">${i+1}</span><span class="pn">${esc(p.name)} <span class="tiny muted">(가상 학생)</span></span><span class="tagx tag-done">입장</span></div>`).join('');
  return `<div class="card">
    <div class="notice" style="margin-bottom:14px">🕹️ <b>데모 모드</b>입니다. 가상 학생 8명이 자동으로 투자해요. 진행자가 되어 라운드를 넘기며 대시보드를 체험해 보세요. 실제 수업에선 진짜 학생들이 방 코드로 접속합니다.</div>
    <div class="center"><div class="bigcode" style="font-size:28px">DEMO-01</div></div>
    <button class="btn btn-green" style="margin-top:6px" onclick="demoStartGame()">게임 시작 · 1라운드 열기</button>
    <button class="btn btn-line btn-sm" style="margin-top:10px" onclick="demoStudentPreview(1)">🎓 학생이 보는 화면 미리보기</button>
  </div>
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h3>입장한 가상 학생</h3><span class="pill">${PLAYERS.length}명</span></div><div class="plist">${plist}</div></div>`;
}
function demoRoundView(){

  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center"><div><div class="eyebrow">진행 중</div><h2 style="margin-top:3px">${round}라운드 · 투자 접수</h2></div>
    <div class="center"><div class="num" style="font-size:26px;font-weight:800">${done}<span class="muted" style="font-size:16px">/${total}</span></div><div class="tiny muted">제출</div></div></div>
    <div class="btn-row" style="margin-top:12px">
      <button class="btn btn-line btn-sm" style="flex:none;width:auto;padding:11px 16px" onclick="openNews(${round})">📰 뉴스</button>
      <button class="btn btn-line btn-sm" style="flex:none;width:auto;padding:11px 16px" onclick="demoStudentPreview(${round})">🎓 학생화면</button>
      <button class="btn btn-green" onclick="demoReveal()">결과 공개 →</button>
    </div>
  </div>
  <div class="card"><h3 style="margin-bottom:10px">실시간 현황 (자산순)</h3><div class="plist">${rows}</div></div>`;
}

    <div class="paper-head"><div class="k">KOSPI IN THE CLASS</div><div class="t">코스피일보 · ${round}라운드</div></div>${newsHtml}
    <h3 style="margin:14px 0 8px">💰 투자 (10개 기업 중 일부)</h3>${coHtml}
    <div class="notice" style="margin-top:10px">실제 화면에선 남은 현금·합계가 하단에 고정되고, ‘투자 확정’을 누르면 제출돼요.</div>`);
}
